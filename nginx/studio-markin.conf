# Nginx — Studio Markin Tattoo
# Substitua SEU_DOMINIO.com.br pelo seu domínio real
# Copiar para: /etc/nginx/sites-available/studio-markin

server {
    listen 80;
    server_name SEU_DOMINIO.com.br www.SEU_DOMINIO.com.br;

    # Redirecionar HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name SEU_DOMINIO.com.br www.SEU_DOMINIO.com.br;

    # Certificados SSL (gerados pelo Certbot)
    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Segurança: cabeçalhos HTTP extras
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamanho máximo de upload (50MB — para imagens/vídeos do admin)
    client_max_body_size 55M;

    # ── Ficheiros estáticos do frontend (build do Vite) ─────────────────────
    root /var/www/studio-markin/frontend/dist;
    index index.html;

    # Páginas SPA: qualquer rota não encontrada → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Páginas multi-entry do Vite
    location /curso {
        try_files $uri $uri/ /curso.html;
    }
    location /joias {
        try_files $uri $uri/ /joias.html;
    }
    location /joalheria {
        try_files $uri $uri/ /joalheria.html;
    }

    # ── API → Node.js backend na porta 5175 ─────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Media (imagens/vídeos guardados pelo backend) ───────────────────────
    location /media/ {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /admin-media/ {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Cache de assets estáticos (JS, CSS, imagens do build)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2|woff|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
